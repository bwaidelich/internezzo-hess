Internezzo:
  HessMaster:
    # Content dimension presets available in each site (indexed by site node name and dimension name).
    # The first preset is the default of the site unless the global default preset is allowed.
    # Sites that are not listed here can use all presets.
    # See Internezzo\HessMaster\Domain\Service\SiteAwareContentDimensionPresetSource
    dimensionPresetsBySite:
      'internezzo-hessmaster':
        language: ['mul']
      'internezzo-hessbus':
        language: ['de', 'fr', 'it']
      'internezzo-hessnutzfahrzeuge':
        language: ['de', 'fr', 'it']
    locations:
      # Node name of the master site. Its "locations" document holds the actual location documents which only exist
      # in the language independent dimension (see Internezzo.HessMaster.dimensionPresetsBySite)
      masterSiteNodeName: 'internezzo-hessmaster'
      # Language presets of the translatable location properties (e.g. "title_de"). The first one is the primary
      # language that the inherited "title" and "uriPathSegment" properties of the master location are derived from
      languages: ['de', 'fr', 'it']

Neos:
  ContentRepository:
    contentDimensions:
      'language':
        presets:
          # Language independent content (e.g. the master locations), only available in the master site
          'mul':
            label: 'Mehrsprachig'
            values: ['mul_zz']
            uriSegment: 'mul'
            position: 'end'
  Fusion:
    defaultContext:
      'Internezzo.HessMaster.Location': 'Internezzo\HessMaster\Eel\LocationHelper'
