# Document of a local site that references a master location in one language.
# Created, updated and removed automatically according to the "sites" property of the master location
# (see Internezzo\HessMaster\Service\LocationReferenceSynchronizer).
'Internezzo.HessMaster:Document.LocationReference':
  superTypes:
    'Neos.Neos:Document': true
    #'Internezzo.HessMaster:Mixin.PreventCreation': true
    #'Internezzo.HessMaster:Mixin.PreventEdits': true
    #'Internezzo.HessMaster:Mixin.PreventRemoval': true
  ui:
    icon: link
    label: 'Location reference'
  label: "${q(node).property('title') + ' (Referenz)'}"
  properties:
    # Identifier of the master location. This is not a "reference" property because the master location
    # exists in a different dimension (see Internezzo\HessMaster\Eel\LocationHelper::master())
    location:
      type: string
