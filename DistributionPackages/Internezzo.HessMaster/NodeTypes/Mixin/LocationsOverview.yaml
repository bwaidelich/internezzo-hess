# Marks a document as "Locations" overview of a non-master site.
# The master locations are referenced by Internezzo.HessMaster:Document.LocationReference documents underneath it
# (see Internezzo\HessMaster\Service\LocationReferenceSynchronizer)
'Internezzo.HessMaster:Mixin.LocationsOverview':
  abstract: true
  constraints:
    nodeTypes:
      'Internezzo.HessMaster:Document.LocationReference': true
